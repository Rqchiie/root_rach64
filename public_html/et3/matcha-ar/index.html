<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- CLICK COMPONENT -->
    <script>
        AFRAME.registerComponent('click-handler', {
            init: function () {
                const el = this.el;

                // MOBILE (touch)
                el.sceneEl.addEventListener('touchstart', (event) => {
                    const touch = event.touches[0];
                    const mouse = new THREE.Vector2(
                        (touch.clientX / window.innerWidth) * 2 - 1,
                        -(touch.clientY / window.innerHeight) * 2 + 1
                    );

                    const camera = el.sceneEl.camera;
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);

                    const intersects = raycaster.intersectObject(el.object3D, true);

                    if (intersects.length > 0) {
                        el.emit('startAnim');
                    }
                });
            }
        });
    </script>
</head>

<body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable">

        <a-assets>
            <a-asset-item id="logo" src="./models/logo.glb"></a-asset-item>
            <a-asset-item id="matcha" src="./models/matcha.glb"></a-asset-item>
            <a-asset-item id="mochi" src="./models/mochi.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Marker 1 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#logo" scale="0.3 0.3 0.3" class="clickable" click-handler
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear; startEvents: startAnim">
            </a-gltf-model>
        </a-entity>

        <!-- Marker 2 -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-gltf-model src="#matcha" scale="0.5 0.5 0.5" class="clickable" click-handler
                animation="property: position; to: 0 0.2 0; dir: alternate; dur: 1200; loop: true; easing: easeInOutQuad; startEvents: startAnim">
            </a-gltf-model>
        </a-entity>

        <!-- Marker 3 -->
        <a-entity mindar-image-target="targetIndex: 2">
            <a-gltf-model src="#mochi" scale="0.5 0.5 0.5" class="clickable" click-handler
                animation="property: scale; to: 0.6 0.6 0.6; dir: alternate; dur: 800; loop: true; easing: easeInOutQuad; startEvents: startAnim">
            </a-gltf-model>
        </a-entity>

    </a-scene>
</body>

</html>
